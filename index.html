<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weightlifting Calculator - IN-VISION STRENGTH SYSTEMS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #eee;
            padding: 20px;
        }
        .company-name {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 3px;
            color: #C0C0C0;
            text-transform: uppercase;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #4169E1;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        .total-section, .input-section {
            max-width: 600px;
            margin: 0 auto 25px;
            background: rgba(255,255,255,0.05);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid rgba(65,105,225,0.3);
        }
        .total-section h2, .input-section h2 {
            color: #4169E1;
            margin-bottom: 15px;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        label { font-weight: 600; min-width: 140px; }
        input[type="number"] {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 16px;
            width: 120px;
        }
        select {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
        }
        select option {
            background: #1a1a2e;
            color: #fff;
            padding: 10px;
        }
        .both-units {
            color: #C0C0C0;
            font-size: 14px;
        }
        button {
            background: #4169E1;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.3s;
        }
        button:hover { background: #5B7FE8; }
        .split-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }
        .split-card {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(65,105,225,0.3);
            border-radius: 10px;
            padding: 14px;
            cursor: pointer;
            text-align: left;
            color: #eee;
            font-family: inherit;
        }
        .split-card:hover { border-color: #4169E1; background: rgba(65,105,225,0.15); }
        .split-card.selected { border-color: #C0C0C0; background: rgba(192,192,192,0.2); }
        .split-card .split-label { font-weight: 700; color: #4169E1; margin-bottom: 6px; }
        .split-card .split-pct { color: #C0C0C0; font-size: 13px; margin-bottom: 8px; }
        .split-card .split-line { font-size: 14px; margin-bottom: 2px; }
        .results { max-width: 1000px; margin: 0 auto; }
        .lift-card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(65,105,225,0.2);
        }
        .lift-card h2 {
            color: #4169E1;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(65,105,225,0.3);
            padding-bottom: 10px;
        }
        .max-display {
            font-size: 20px;
            margin-bottom: 15px;
            color: #C0C0C0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        th { color: #4169E1; }
        .hidden { display: none; }
        .summary-table {
            max-width: 800px;
            margin: 0 auto 40px;
            background: rgba(255,255,255,0.05);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid rgba(65,105,225,0.3);
        }
        .summary-table h2 {
            color: #4169E1;
            margin-bottom: 20px;
        }
        .summary-table table {
            width: 100%;
            border-collapse: collapse;
        }
        .summary-table th {
            background: rgba(192,192,192,0.2);
            color: #fff;
            padding: 12px;
            text-align: left;
        }
        .summary-table th:not(:first-child) { text-align: center; }
        .summary-table td { padding: 12px; }
        .summary-table td:not(:first-child) { text-align: center; }
        .summary-table tr.total-row {
            background: rgba(192,192,192,0.25);
            font-weight: bold;
        }
        .summary-table tr.total-row td { color: #C0C0C0; }
    </style>
</head>
<body>
    <div class="company-name">IN-VISION STRENGTH SYSTEMS</div>
    <h1>Weightlifting Calculator</h1>

    <div class="total-section">
        <h2>Start From a Total</h2>
        <div class="input-group">
            <label for="totalKg">Total (kg):</label>
            <input type="number" id="totalKg" placeholder="e.g. 152">
            <span class="both-units" id="totalBothUnits"></span>
        </div>
        <div class="split-cards hidden" id="splitCards"></div>
    </div>

    <div class="input-section">
        <h2>Or Enter Lifts Directly</h2>
        <div class="input-group">
            <label>Snatch 1RM:</label>
            <input type="number" id="snatch" placeholder="Weight">
            <select id="snatchUnit"><option value="lbs">lbs</option><option value="kg">kg</option></select>
            <span class="both-units" id="snatchBothUnits"></span>
        </div>
        <div class="input-group">
            <label>Clean & Jerk 1RM:</label>
            <input type="number" id="cnj" placeholder="Weight">
            <select id="cnjUnit"><option value="lbs">lbs</option><option value="kg">kg</option></select>
            <span class="both-units" id="cnjBothUnits"></span>
        </div>
        <button onclick="calculate()">Calculate</button>
    </div>

    <div class="summary-table hidden" id="summaryTable"></div>
    <div class="results hidden" id="results"></div>

    <script src="calculator.js"></script>
    <script src="app.js"></script>
</body>
</html>
